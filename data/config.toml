# devsandbox configuration for the projects under ./data.
#
# Every sandbox shares the `base` template, which:
#   1. wires up the zidane agent (host binary + credentials), and
#   2. points pnpm and cargo at persistent, host-backed caches so downloads
#      survive container rebuilds.
#
# Persistent state lives next to this file in ./shared-volumes/ (created on
# first run). Package caches are shared across sandboxes; shell history is
# per-instance and managed by devsandbox itself.
#
# Legend for the comments below:
#   [today]    works with the current CLI
#   [PROPOSED] needs a CLI change — see docs/config-toml-findings.md

# ===========================================================================
# Common template
# ===========================================================================
[template.base]
# Most of these images run as root; keep it explicit. Applied as `docker exec -u`.
remoteUser = "root"

# zidane agent, bind-mounted from the host. ${localEnv:VAR} and ${configDir}
# (the directory holding this config.toml) are substituted.
mounts = [
  "source=${localEnv:HOME}/.zidane/zidane,target=/root/.zidane/zidane,type=bind",
  "source=${localEnv:HOME}/.zidane/credentials.json,target=/root/.zidane/credentials.json,type=bind",
]

# Shared, persistent package-manager caches. Each expands into a bind mount under
# ./shared-volumes/<name> plus the env vars that point the tool at it.
caches = ["pnpm", "cargo"]

# Provision ./shared-volumes/history/<instance>.zsh_history and bind-mount it to
# /root/.zsh_history, unique per running instance, so history survives rebuilds
# and is never shared between concurrent sandboxes.
persist-shell-history = true

# ===========================================================================
# Services. Default scope is `isolated`: each sandbox instance gets its own
# container on a per-instance network, reachable by service name — so concurrent
# instances never share a database. Set `scope = "global"` for a single shared
# container across the config root. Services take an `image` or a `build`.
# ===========================================================================
[services.postgres-plv8]
image = "nemikolh/postgres-plv8:17-plv8-3.2.3"
env = { POSTGRES_USER = "postgres", POSTGRES_PASSWORD = "postgres", POSTGRES_DB = "bolt" }

[services.restate]
image = "docker.restate.dev/restatedev/restate:latest"

[services.postgres]
image = "postgres:16"
env = { POSTGRES_USER = "postgres", POSTGRES_PASSWORD = "postgres", POSTGRES_DB = "stackblitz_development" }

[services.redis]
image = "redis:6.2-alpine"

# ===========================================================================
# Sandboxes — folder names under ./data map to project names.
# `folder` points at the actual project checkout on the host (edit to taste).
# ===========================================================================

# bolt.new + Restate (Node + Rust). Was a docker-compose devcontainer; modeled
# here with shared services instead. App reaches the DB by service alias.
[sandbox.bolt-restate]
extends = "base"
folder = "../stackblitz/bolt-aurora"
workspaceFolder = "/workspaces/bolt"
build = { dockerfile = "bolt-restate/Dockerfile", context = "bolt-restate" }
services = ["postgres-plv8", "restate"]
init = true # docker run --init (tini)
customizations.vscode.extensions = [
  "esbenp.prettier-vscode",
  "EditorConfig.EditorConfig",
  "antfu.unocss",
  "tamasfe.even-better-toml",
  "rust-lang.rust-analyzer",
  "eamodio.gitlens",
]

[sandbox.bolt-restate.containerEnv]
DISPLAY = ":1"
RESTATE_DEPLOYMENT_URL = "http://127.0.0.1:5173/restate"
WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE = "postgres://postgres:postgres@postgres-plv8:5432/bolt"
WRANGLER_SEND_METRICS = "false"

# StackBlitz Rails (Ruby + Node). Postgres + Redis as shared services.
[sandbox.rails]
extends = "base"
folder = "../stackblitz/stackblitz"
workspaceFolder = "/workspaces/stackblitz"
build = { dockerfile = "rails/Dockerfile", context = "rails" }
services = ["postgres", "redis"]
postCreateCommand = "cd rails && bundle install"
customizations.vscode.extensions = [
  "eamodio.gitlens",
  "vortizhe.simple-ruby-erb",
]

[sandbox.rails.features]
"ghcr.io/devcontainers/features/common-utils:2" = true
"ghcr.io/devcontainers/features/node:1" = true

[sandbox.rails.containerEnv]
LEFTHOOK = "0"
DATABASE_URL = "postgres://postgres:postgres@postgres:5432"
REDIS_URL = "redis://redis:6379/0"
SERVICES_URL = "http://services.local.stackblitz.com:8000"
GCP_SERVICES_URL = "http://services.local.stackblitz.com:8000"

# WebContainer (Rust + wasm + Node). Dockerfile COPYs packages/fs/rust-toolchain,
# so the build context must be the repo root.
[sandbox.webcontainer]
extends = "base"
folder = "../stackblitz/webcontainer"
build = { dockerfile = "webcontainer/Dockerfile", context = "repos/webcontainer" }
postCreateCommand = "yarn --silent --non-interactive"
# [PROPOSED] this project needs an env-file (--env-file) and --add-host. Do NOT
# commit real secrets — devcontainer.env currently does; move to host-only.
customizations.vscode.extensions = [
  "dbaeumer.vscode-eslint",
  "esbenp.prettier-vscode",
  "vadimcn.vscode-lldb",
  "rust-lang.rust-analyzer",
  "tamasfe.even-better-toml",
  "serayuzgur.crates",
  "dtsvet.vscode-wasm",
  "EditorConfig.EditorConfig",
]

# wasm-typescript (Node + Go via TinyGo). Single-file devcontainer originally.
[sandbox.wasm-typescript]
extends = "base"
folder = "repos/wasm-typescript"
image = "mcr.microsoft.com/devcontainers/javascript-node:24"
# goreleaser + tinygo have no official devcontainer feature, so they stay here.
postCreateCommand = "echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | tee /etc/apt/sources.list.d/goreleaser.list >/dev/null && apt-get update && apt-get install -y goreleaser && wget -q https://github.com/tinygo-org/tinygo/releases/download/v0.41.1/tinygo_0.41.1_amd64.deb -O /tmp/tinygo.deb && dpkg -i /tmp/tinygo.deb && rm /tmp/tinygo.deb"
customizations.vscode.extensions = [
  "esbenp.prettier-vscode",
  "EditorConfig.EditorConfig",
  "eamodio.gitlens",
  "golang.go",
]

[sandbox.wasm-typescript.features]
"ghcr.io/devcontainers/features/go:1" = true

# goj (Go + Rust + Node). Prebuilt base image; build it from goj/base/Dockerfile.
[sandbox.goj]
extends = "base"
folder = "repos/goj"
workspaceFolder = "/workspaces/goj"
image = "nemikolh/goj-base:latest"
customizations.vscode.extensions = [
  "esbenp.prettier-vscode",
  "EditorConfig.EditorConfig",
  "eamodio.gitlens",
  "golang.go",
  "rust-lang.rust-analyzer",
]

# zidane itself (Node tooling).
[sandbox.zidane]
extends = "base"
folder = "repos/zidane"
build = { dockerfile = "zidane/Dockerfile", context = "zidane" }
customizations.vscode.extensions = [
  "esbenp.prettier-vscode",
  "EditorConfig.EditorConfig",
  "unifiedjs.vscode-mdx",
  "eamodio.gitlens",
]

[sandbox.zidane.features]
"ghcr.io/devcontainers/features/common-utils:2" = true
"ghcr.io/devcontainers/features/node:1" = true
"ghcr.io/devcontainers/features/git:1" = true
