name: Pages

# Deploys the docs site (site/) to GitHub Pages (devsandboxes.com).
# Called by release.yml after a release is published, so the docs match what
# users can install. Run it by hand ("Run workflow", pick the branch or tag)
# to ship docs-only changes between releases.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
          cache: true
          cache_dependency_path: site/pnpm-lock.yaml
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Never cancel a deploy halfway; a newer run queues behind it.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
