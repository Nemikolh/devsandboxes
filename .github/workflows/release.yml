name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      git: ${{ steps.check.outputs.git }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          # release.sh bumps the npm packages in tandem; catch a hand-edited drift
          # before building anything.
          for pkg in npm/devsandboxes npm/platforms/*; do
            node -e '
              const p = require(`./${process.argv[1]}/package.json`);
              const bad = [["version", p.version], ...Object.entries(p.optionalDependencies ?? {})]
                .filter(([, v]) => v !== process.argv[2]);
              if (bad.length) { console.error(`${p.name}: ${bad.map(([k, v]) => `${k}=${v}`).join(", ")} != ${process.argv[2]}`); process.exit(1); }
            ' "$pkg" "$version"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The git hash build.rs `stamp_build` puts in every build's fleet
          # `Hello` (same command, same checkout): one value all four `build`
          # runners are checked against.
          git=$(git rev-parse --short=12 HEAD)
          if ! [[ "$git" =~ ^[0-9a-f]{12}$ ]]; then
            echo "git rev-parse --short=12 HEAD gave '$git', not a 12-digit hash" >&2
            exit 1
          fi
          echo "git=$git" >> "$GITHUB_OUTPUT"

  devsbd:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # rust-lld (via .cargo/config.toml) cross-links musl from any host, so no
      # musl-tools needed for the helper.
      - run: rustup target add ${{ matrix.arch }}-unknown-linux-musl
      - run: cargo build -p devsbd --profile devsbd --target ${{ matrix.arch }}-unknown-linux-musl
      - uses: actions/upload-artifact@v7
        with:
          name: devsbd-${{ matrix.arch }}
          path: target/${{ matrix.arch }}-unknown-linux-musl/devsbd/devsbd
          if-no-files-found: error

  build:
    needs: [version, devsbd]
    strategy:
      fail-fast: false
      matrix:
        include:
          # platform: the `<os>/<arch>` (std::env::consts) its fleet-hello says.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux/x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            platform: linux/aarch64
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos/aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows/x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Both helpers get embedded into every release binary (build.rs reads
      # $DEVSANDBOX_DEVSBD_DIR/<arch>/devsbd); DEVSANDBOX_DEVSBD_REQUIRED=1 makes
      # a missing helper a build error so a release never ships without it.
      - uses: actions/download-artifact@v7
        with:
          name: devsbd-x86_64
          path: ${{ runner.temp }}/devsbd/x86_64
      - uses: actions/download-artifact@v7
        with:
          name: devsbd-aarch64
          path: ${{ runner.temp }}/devsbd/aarch64
      - run: cargo build --release --target ${{ matrix.target }}
        env:
          # Static CRT on Windows so the binary doesn't need the VC++ redistributable
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
          DEVSANDBOX_DEVSBD_DIR: ${{ runner.temp }}/devsbd
          DEVSANDBOX_DEVSBD_REQUIRED: "1"
          # Stamps the fleet `Hello` as `published` (build.rs `stamp_build`):
          # these archives are the release assets a fleet member downloads to
          # follow a hub on this version (`fleet::update::asset_url`).
          DEVSANDBOX_PUBLISHED: "1"
      # These binaries are what fleet members download to follow a published
      # hub, and the member checks the download's `fleet-hello` is the hub's
      # build: a wrong stamp (`dev`, `unknown` git, another platform) makes
      # members re-download in a loop or refuse the hub.
      - name: Check the fleet stamp
        shell: bash
        env:
          WANT: ${{ needs.version.outputs.version }} ${{ needs.version.outputs.git }} published ${{ matrix.platform }}
          BIN: target/${{ matrix.target }}/release/devsandbox${{ contains(matrix.target, 'windows') && '.exe' || '' }}
        run: |
          got=$("$BIN" fleet-hello)
          echo "fleet-hello: $got"
          if [ "$got" != "$WANT" ]; then
            echo "::error::fleet-hello is '$got', want '$WANT'"
            exit 1
          fi
      - name: Package
        shell: bash
        run: |
          name="devsandbox-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir dist
          case "${{ matrix.target }}" in
            *windows*)
              (cd "target/${{ matrix.target }}/release" && 7z a "$GITHUB_WORKSPACE/dist/$name.zip" devsandbox.exe)
              ;;
            *)
              tar czf "dist/$name.tar.gz" -C "target/${{ matrix.target }}/release" devsandbox
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: devsandbox-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Outside the checkout: untracked archives would make `cargo publish`
      # refuse to run on a dirty tree.
      - uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/dist
          pattern: devsandbox-*
          merge-multiple: true
      - run: scripts/changelog-section.sh ${{ needs.version.outputs.version }} > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ runner.temp }}/dist/*
          body_path: ${{ runner.temp }}/notes.md
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: the registry trades this job's OIDC token for a
      # short-lived publish token, so no NPM_TOKEN secret is involved.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: devsandbox-*
          merge-multiple: true
      # No registry-url: its generated .npmrc expects a token.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - name: Stage binaries into the platform packages
        run: |
          v=${{ needs.version.outputs.version }}
          stage() { # <rust target> <npm platform dir> <archive ext>
            bin=npm/platforms/$2/bin
            mkdir -p "$bin"
            case "$3" in
              zip) unzip -j "dist/devsandbox-$v-$1.zip" -d "$bin" ;;
              *) tar xzf "dist/devsandbox-$v-$1.tar.gz" -C "$bin" && chmod +x "$bin/devsandbox" ;;
            esac
          }
          stage x86_64-unknown-linux-musl linux-x64 tar.gz
          stage aarch64-unknown-linux-musl linux-arm64 tar.gz
          stage aarch64-apple-darwin darwin-arm64 tar.gz
          stage x86_64-pc-windows-msvc win32-x64 zip
      # Platform packages first: the root package's optionalDependencies pin
      # them exactly, so it must never be visible before they are. Already
      # published versions are skipped so a failed run can be re-run.
      - name: Publish to npm
        run: |
          v=${{ needs.version.outputs.version }}
          for dir in npm/platforms/* npm/devsandboxes; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$v" version >/dev/null 2>&1; then
              echo "$name@$v already published, skipping"
            else
              npm publish "./$dir" --access public
            fi
          done

  # Docs follow releases: deployed only once the binaries and npm packages the
  # site's install commands point at are live.
  pages:
    needs: [release, npm]
    # A called workflow can't be granted more than its caller job has.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
