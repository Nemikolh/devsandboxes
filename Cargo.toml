[package]
name = "devsandbox"
version = "0.2.3"
edition = "2024"
description = "Manage devcontainer-style sandboxes on docker, podman, or Apple container — many throwaway instances per repo from one TOML config."
license = "MIT"
exclude = ["docs/", "release.sh", ".agents/", ".github/"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
portable-pty = "0.9"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.5"
tui-term = "0.3.4"
vt100 = "0.16"
