[package]
name = "devsandbox"
version = "0.6.0"
edition = "2024"
description = "Manage devcontainer-style sandboxes on docker, podman, or Apple container — many throwaway instances per repo from one TOML config."
license = "MIT"
exclude = ["docs/", "release.sh", ".agents/", ".github/", "/devsbd/", "/test-utils/", "/scripts/", "/npm/"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
portable-pty = "0.9"
# Inbox thread markdown; the defaults only add a CLI (getopts) and HTML output.
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.5"
tui-term = "0.3.4"
vt100 = "0.16"
ruzstd = "0.8"
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }

[build-dependencies]
sha2 = "0.10"
zstd = "0.13"

[dev-dependencies]
# Tests roundtrip through the same encoder build.rs uses.
zstd = "0.13"
# Path-only, so `cargo publish` strips it: test-utils is never published.
test-utils = { path = "test-utils" }

[workspace]
members = [".", "devsbd", "test-utils"]

# Only the helper build uses this; lto/strip/panic can't be set per package.
[profile.devsbd]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
