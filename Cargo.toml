[package]
name = "devsandbox"
version = "0.10.0"
edition = "2024"
description = "Manage devcontainer-style sandboxes on docker, podman, or Apple container — many throwaway instances per repo from one TOML config."
license = "MIT"
exclude = ["docs/", "release.sh", ".agents/", ".github/", "/devsbd/", "/test-utils/", "/scripts/", "/npm/"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
# `setsid` for the detached `devsandbox serve` lazy start, `poll` for its accept loop.
libc = "0.2"
portable-pty = "0.9"
# Inbox thread markdown; the defaults only add a CLI (getopts) and HTML output.
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
# The fleet link's transfers check their body's hash (`serve::fleet::transfer`).
sha2 = "0.11"
# Fleet member keys: sign/verify (`serve::fleet::identity`).
ed25519-dalek = "3.0.0"
# A new member key's seed from the OS RNG (`serve::fleet::identity`), rather than `rand`.
getrandom = "0.3"
# A routed stream's end-to-end session (`serve::fleet::session`): ephemeral DH,
# per-direction keys, sealed records.
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
hkdf = "0.13"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
# Member keys' and statements' text forms (`serve::fleet::identity`); already in the tree.
hex = "0.4"
# The credential broker's request heads (`broker::head`).
httparse = "1.10.1"
# The broker's upstream TLS (`broker::upstream`): ring rather than the default
# aws-lc-rs (docs/plans/active/mtls-links.md), the host's native roots.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
# The member CA and its leaves (`credentials::ca`), on ring like rustls.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
# The bundle written into an image that has none (`credentials::trust`):
# webpki-roots' Mozilla set as whole certificates, which a PEM bundle needs.
webpki-root-certs = "1"
# An upstream's gzip/deflate answer despite `Accept-Encoding: identity`.
flate2 = "1.1.11"
toml = "1.1.5"
tui-term = "0.3.4"
vt100 = "0.16"
ruzstd = "0.8"
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
toml_edit = { version = "0.25.15", default-features = false, features = ["parse", "display"] }

[build-dependencies]
sha2 = "0.11"
zstd = "0.13"

[dev-dependencies]
# Tests roundtrip through the same encoder build.rs uses.
zstd = "0.13"
# Path-only, so `cargo publish` strips it: test-utils is never published.
test-utils = { path = "test-utils" }

[workspace]
members = [".", "devsbd", "test-utils"]

# Only the helper build uses this; lto/strip/panic can't be set per package.
[profile.devsbd]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# `fleet::update::own_sha256` hashes this binary (hundreds of MB in a debug
# build) in every daemon and `fleet-link` process: unoptimized sha2 takes
# seconds over it, enough to slow every link's handshake.
[profile.dev.package.sha2]
opt-level = 3
