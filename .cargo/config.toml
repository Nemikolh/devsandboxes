[env]
# Where build.rs looks for prebuilt helpers (scripts/build-devsbd.sh output).
# CI overrides this with the downloaded artifacts dir.
DEVSANDBOX_DEVSBD_DIR = { value = "target/devsbd", relative = true }

# musl targets ship their own CRT objects, so rust-lld cross-links both arches
# from any host without a C toolchain.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
